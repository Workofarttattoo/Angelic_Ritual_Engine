[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ritual-engine"
version = "0.2.0"
description = "Orchestration toolkit for symbolic imports, image cleanup, and immersive visualisation of ritual knowledge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.6,<3",
    "requests>=2.31,<3",
    "pdf2image>=1.17,<2",
    "pillow>=10.2,<11",
    "opencv-python>=4.9,<5",
    "numpy>=1.26,<2",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0,<7",
    "Unidecode>=1.3,<2",
    "python-slugify>=8.0,<9",
    "pytesseract>=0.3,<1",
    "PyMuPDF>=1.26,<2",
    "tqdm>=4.66,<5",
    "jinja2>=3.1,<4",
    "typer>=0.9,<1",
    "uvicorn[standard]>=0.27,<1",
    "astral>=3.2,<4",
    "networkx>=3.2,<4",
    "matplotlib>=3.8,<4",
    "streamlit>=1.31,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "httpx>=0.27",
]

[project.scripts]
ritual-engine = "agentic_ritual_engine.main:cli"

[tool.setuptools.packages.find]
include = ["agentic_ritual_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
